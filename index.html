<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>531 重量訓練規劃器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>531 重量訓練規劃器</h1>
            <p class="subtitle">基於 Jim Wendler 的 5/3/1 訓練法 | <a href="https://github.com/yentingli/ez531" target="_blank" rel="noopener noreferrer">原始碼及使用說明</a>
        </header>

        <section class="input-section">
            <h2>訓練參數設定</h2>
            <div class="input-row">
                <div class="input-group">
                    <label for="squat-1rm">深蹲 1RM (kg)</label>
                    <input type="number" id="squat-1rm" step="0.1" min="0" value="100">
                </div>
                <div class="input-group">
                    <label for="ohp-1rm">肩推 1RM (kg)</label>
                    <input type="number" id="ohp-1rm" step="0.1" min="0" value="60">
                </div>
                <div class="input-group">
                    <label for="deadlift-1rm">硬舉 1RM (kg)</label>
                    <input type="number" id="deadlift-1rm" step="0.1" min="0" value="150">
                </div>
                <div class="input-group">
                    <label for="bench-1rm">臥推 1RM (kg)</label>
                    <input type="number" id="bench-1rm" step="0.1" min="0" value="80">
                </div>
                <div class="input-group">
                    <label for="training-max">Training Max</label>
                    <select id="training-max">
                        <option value="0.9">90%</option>
                        <option value="0.95">95%</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="tolerance">容忍度 (kg)</label>
                    <input type="number" id="tolerance" step="0.1" min="0.1" value="1" placeholder="1">
                </div>
                <div class="input-group input-group-button">
                    <button id="generate-btn" class="btn-primary">產生計劃</button>
                </div>
                <div class="input-group input-group-button">
                    <button id="save-all-btn" class="btn-primary">儲存所有設定</button>
                </div>
            </div>
        </section>

        <section class="equipment-section">
            <h2 class="collapsible-header" onclick="toggleEquipmentSection()">
                <span>設備配置</span>
                <span class="collapse-icon" id="equipment-collapse-icon">▶</span>
            </h2>

            <div class="equipment-grid" id="equipment-grid" style="display: none;">
                <div class="equipment-subsection">
                    <div class="subsection-header">
                        <h3>槓鈴配置</h3>
                        <div class="subsection-header-buttons">
                            <button id="add-barbell-btn" class="btn-secondary btn-small">新增槓鈴</button>
                            <button id="reset-barbells-btn" class="btn-secondary btn-small">重置槓鈴</button>
                        </div>
                    </div>
                    <div id="barbells-container"></div>
                </div>

                <div class="equipment-subsection">
                    <div class="subsection-header">
                        <h3>槓片配置</h3>
                        <div class="subsection-header-buttons">
                            <button id="add-plate-type-btn" class="btn-secondary btn-small">新增槓片類型</button>
                            <button id="reset-plates-btn" class="btn-secondary btn-small">重置槓片</button>
                        </div>
                    </div>
                    <div id="plates-container"></div>
                </div>
            </div>
        </section>

        <section id="program-section" class="program-section" style="display: none;">
            <div class="program-header">
                <h2>訓練計劃</h2>
                <div class="program-header-buttons">
                    <button id="print-btn" class="btn-primary btn-print">列印課表</button>
                    <button id="export-markdown-btn" class="btn-primary btn-print">複製 Markdown 課表</button>
                </div>
            </div>
            <div id="program-table"></div>
        </section>
    </div>

    <script src="js/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/equipment.js"></script>
    <script src="js/calculator.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/program.js"></script>
    <script src="js/export.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
